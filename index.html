<!DOCTYPE html>
<html>
<head>
  <title>Checkbox to Google Sheets</title>
</head>
<body>
  <h2>Select your favorite fruit:</h2>
  <form>
    <input type="checkbox" id="apple" value="Apple">
    <label for="apple">Apple</label><br>

    <input type="checkbox" id="banana" value="Banana">
    <label for="banana">Banana</label><br>

    <input type="checkbox" id="cherry" value="Cherry">
    <label for="cherry">Cherry</label><br>
  </form>

  <button onclick="saveSelection()">Submit</button>

  <script>
    function saveSelection() {
      const checkboxes = document.querySelectorAll('input[type="checkbox"]:checked');
      let selected = [];
      checkboxes.forEach(cb => selected.push(cb.value));

      fetch("https://script.google.com/macros/s/AKfycbzLlPYXWK5RBX5Jiy5aQGeHOwqaXMsvOf9WQevI8XAPRBoETzOpHbfTa2mQCKFXeln3/exec", {
        method: "POST",
        body: JSON.stringify({ selection: selected.join(", ") })
      })
      .then(res => res.text())
      .then(msg => alert(msg))
      .catch(err => alert("Error: " + err));
    }
  </script>
</body>

</html>
